name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global serve
      - run: serve -l 4173 . &
      - run: npx wait-on http://localhost:4173
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/servicios.html
            http://localhost:4173/nosotros.html
            http://localhost:4173/cotizacion.html
          uploadArtifacts: true
